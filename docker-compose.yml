# One Kafka broker + TWO independent Schema Registries on it:
#   sr-source :8081  -> topic _schemas          group sr-source   (pretend this is production)
#   sr-target :8082  -> topic _schemas_restore  group sr-target   (empty restore target)
# Different topic AND different group id = two fully independent registries.

services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    # Without this, a host reboot leaves kafka stopped while both registries
    # (restart: on-failure) loop forever against a broker that never comes back.
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  sr-source:
    # NOT 8.1.5 - that published amd64 image has zero-byte binaries and every
    # container dies with "exec /etc/confluent/docker/run: exec format error".
    image: confluentinc/cp-schema-registry:8.1.0
    container_name: sr-source
    depends_on: [kafka]
    restart: on-failure
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: sr-source
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_SCHEMA_REGISTRY_GROUP_ID: sr-source

  sr-target:
    image: confluentinc/cp-schema-registry:8.1.0
    container_name: sr-target
    depends_on: [kafka]
    restart: on-failure
    ports: ["8082:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: sr-target
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas_restore
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_SCHEMA_REGISTRY_GROUP_ID: sr-target
