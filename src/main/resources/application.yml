spring:
  main:
    web-application-type: none   # a CLI tool, not a web service
    banner-mode: off

# sr.url has NO default on purpose: a forgotten --sr.url on restore must not
# silently point at whatever registry happens to be the default.
# BASIC auth: prefer env vars SR_USERNAME / SR_PASSWORD over --sr.password,
# which ends up in shell history and `ps` output.
sr:
  username: ""
  password: ""

logging:
  level:
    root: WARN
    com.example.kafka: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %msg%n"
